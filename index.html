<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enamor Competitor Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#f6f7f9; --card:#ffffff; --ink:#15161c; --ink2:#4d505b; --muted:#878a95; --line:#e8e9ee; --soft:#f2f3f6;
  --accent:#E8590C; --accent-2:#fff1ea; --grey:#cfd3da; --link:#1971C2; --side:248px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;letter-spacing:-.015em;font-weight:600}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit}
/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:22px 14px;overflow-y:auto;z-index:10}
.brandmark{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brandmark .sq{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px Sora}
.brandmark b{font:600 15px Sora;display:block}
.brandmark span{color:var(--muted);font-size:12px}
.side h4{font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--ink2);cursor:pointer;text-align:left;font-weight:500}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-2);color:var(--ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:6;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:22px}
.top .crumb{color:var(--muted);font-size:13px}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--ink2);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.page{max-width:1320px;margin:0 auto;padding:24px 28px 80px}
.burger{display:none}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h3{font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chead .tabs{margin-left:auto}
.tabs{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;max-width:100%;overflow-x:auto}
.tabs button{white-space:nowrap}
.lbfoot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lbfoot div{background:var(--soft);border-radius:10px;padding:12px 14px}
.lbfoot small{display:block;color:var(--muted);font-size:12px}
.lbfoot b{font:600 20px Sora}
.hbar{padding:12px 0}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink2);cursor:pointer;font-size:13px;font-weight:500}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,20,30,.08)}
.row{display:grid;gap:18px;margin-top:18px}
.r-kpi{grid-template-columns:repeat(4,1fr)}
.r-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r-2{grid-template-columns:1fr 1fr}
@media (max-width:1100px){.r-kpi{grid-template-columns:repeat(2,1fr)}.r-main{grid-template-columns:1fr}}
@media (max-width:760px){.r-2{grid-template-columns:1fr}}
/* kpi */
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:500}
.kpi .lab svg{width:18px;height:18px}
.kpi .big{font:600 30px Sora;margin:10px 0 2px;letter-spacing:-.02em;cursor:pointer}
.kpi .big:hover{color:var(--accent)}
.kpi .cap{color:var(--muted);font-size:13px}
.mini{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:12px}
.mini i{flex:1;background:var(--grey);border-radius:3px 3px 0 0;min-height:2px;cursor:pointer}
.mini i.hi{background:var(--accent)}
.mini i:hover{filter:brightness(.9)}
.logo{width:26px;height:26px;border-radius:7px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none;border:1px solid var(--line)}
.av.s{width:22px;height:22px}
.who-cell{display:flex;align-items:center;gap:10px}
.logo.s{width:20px;height:20px;border-radius:5px}
.bn{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap;min-width:0}
.bn span{overflow:hidden;text-overflow:ellipsis}
/* bars */
.hbar{display:grid;grid-template-columns:170px 1fr 84px;align-items:center;gap:12px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--soft)}
.hbar:last-child{border-bottom:0}
.hbar .track{height:12px}
.hbar .fill{height:100%;background:var(--grey);border-radius:0 4px 4px 0;transition:width .4s}
.hbar.hi .fill{background:var(--accent)}
.hbar .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.hbar .v small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.hbar:hover .fill{filter:brightness(.92)}
/* insights rail */
.ins{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ins:first-of-type{padding-top:4px}
.ins:last-child{border-bottom:0;padding-bottom:0}
.ins .no{font:600 13px Sora;color:var(--accent);width:22px;flex:none}
.ins b{display:block;font-weight:600;line-height:1.4}
.ins .fig{font:600 20px Sora;margin:6px 0 2px;cursor:pointer;display:inline-block}
.ins .fig:hover{color:var(--accent)}
.ins p{margin:2px 0;color:var(--ink2);font-size:13px}
.ins .todo{margin-top:6px;font-size:13px;color:var(--ink)}
.ins .todo em{font-style:normal;font-weight:600;color:var(--accent)}
.watch li{margin:8px 0;color:var(--ink2);font-size:13px}
.watch{padding-left:18px;margin:8px 0 0}
/* grids */
.share{display:grid;gap:4px;align-items:center;font-size:13px}
.share .h{color:var(--muted);font-size:12px;text-align:center;line-height:1.25;padding-bottom:4px}
.share .c{height:36px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .1s}
.share .c:hover{transform:scale(1.04)}
.scroll{overflow-x:auto}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);font-weight:500;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom;background:#fff}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td.ev{cursor:pointer;color:var(--link)}
.tbl td.ev:hover{text-decoration:underline}
.tbl .stick{position:sticky;left:0;background:#fff;z-index:1}
.tbl tr.row-hover:hover td{background:#fafbfc}
.tbl .tn{width:44px;height:56px;border-radius:6px;object-fit:cover;background:var(--soft);display:block}
.tbl .wrap{white-space:normal;min-width:260px;max-width:420px;color:var(--ink2)}
.note{color:var(--muted);font-size:12px;margin-top:10px}
/* library */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
select,input[type=search]{font:13px Inter;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{min-width:220px}
.count{color:var(--ink2);margin-left:auto}
.linkbtn{background:none;border:0;color:var(--link);cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 8px 24px rgba(20,20,30,.08);transform:translateY(-2px)}
.thumb{aspect-ratio:4/5;background:var(--soft);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .kind{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.95);color:var(--ink);font:600 11px Inter;padding:3px 8px;border-radius:5px}
.thumb .src{position:absolute;right:8px;top:8px;width:24px;height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.thumb .play{position:absolute;inset:0;margin:auto;width:42px;height:42px;opacity:.9}
.thumb .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:14px}
.tile .info{padding:10px 12px 12px}
.tile .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.tile .line{color:var(--ink2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:2px;min-height:38px}
.tile .themes{color:var(--accent);font-size:12px;font-weight:500;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nums{white-space:nowrap;overflow:hidden;display:flex;gap:12px;color:var(--muted);margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.tile .nums b{color:var(--ink);font-weight:600}
.more{display:block;margin:24px auto 0;padding:10px 22px}
/* brand hero */
.hero{display:flex;gap:18px;align-items:center}
.hero img{width:64px;height:64px;border-radius:16px;border:1px solid var(--line)}
.hero h2{font-size:24px}
.hero .sub{color:var(--muted)}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(20,22,30,.22);display:none;z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:22px 24px;box-shadow:-12px 0 40px rgba(20,20,30,.12)}
.panel.open{transform:none} .scrim.open{display:block}
.panel .x{float:right;border:1px solid var(--line);background:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--ink2)}
.panel video,.panel img.big{width:100%;max-height:64vh;object-fit:contain;background:var(--soft);border-radius:12px;margin:14px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--soft);border-radius:10px;padding:10px}
.stats small{color:var(--muted);display:block;font-size:11px}
.stats b{font:600 16px Sora}
.tx{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:14px;color:var(--ink2);max-height:320px;overflow:auto;line-height:1.6}
.panel h4{font:600 14px Sora;margin:18px 0 8px}
/* report */
.rhero{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:28px}
.rhero h1{font-size:30px;margin:6px 0 8px}
.rhero p{color:var(--ink2);max-width:640px;margin:0}
.eyebrow{color:var(--accent);font:600 12px Inter;letter-spacing:.06em;text-transform:uppercase}
.rstats{display:flex;gap:28px;margin-left:auto;flex-wrap:wrap;align-items:flex-end}
.rstats b{font:600 28px Sora;display:block}
.rstats small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.rtoc{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;position:sticky;top:76px;z-index:4}
.rtoc a{color:var(--ink2);padding:6px 10px;border-radius:7px;font-size:13px}
.rtoc a:hover{background:var(--soft);text-decoration:none;color:var(--ink)}
.rsec{margin-top:18px;scroll-margin-top:140px}
.rsec h2{font-size:22px}
.rsec h3{font-size:16px;margin:22px 0 10px}
.rbody{margin-top:14px;color:var(--ink)}
.rbody p{color:var(--ink2);max-width:860px}
.rlist{padding-left:20px;margin:6px 0}
.rlist li{margin:10px 0;line-height:1.6;color:var(--ink2);max-width:900px}
.rlist li b{color:var(--ink)}
.rlist.big li{margin:16px 0}
.rul{padding-left:18px}.rul li{margin:8px 0;color:var(--ink2);line-height:1.55}
.rt td,.rt th{white-space:normal;min-width:90px;vertical-align:top;text-align:left}
.rt td.l{min-width:150px}
.rt.wide td{min-width:120px}
.reading{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:#fff7f3;border-radius:0 8px 8px 0;color:var(--ink2);font-size:13px;line-height:1.6;max-width:900px}
.reading b{color:var(--accent);margin-right:6px;font-weight:600}
.miss{color:#b54708;font-size:12px}
.trend{font-weight:600;font-size:12px}.t-up{color:var(--accent)}.t-new{color:#1971C2}.t-flat{color:var(--muted)}
.exl{display:inline-flex;align-items:center;gap:8px;color:var(--link)}
.exl img{width:34px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.angcard{border-top:1px solid var(--line);padding-top:6px;margin-top:10px}
.angcard h3 .tagline{color:var(--muted);font:500 13px Inter;margin-left:8px}
.angcard h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grid2r{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.grid2r{grid-template-columns:1fr}.rstats{margin-left:0}.rtoc{position:static}}
/* phone */
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.1)}
  .side.open{transform:none}
  .main{margin-left:0}
  .burger{display:inline-flex}
  .top .in,.page{padding-left:16px;padding-right:16px}
  .top .right{display:none}
  .top .in{flex-wrap:nowrap;gap:12px;padding-top:12px;padding-bottom:12px}
}
@media (max-width:560px){
  .r-kpi{grid-template-columns:1fr}
  .lbfoot{grid-template-columns:1fr}
  .chead .tabs{margin-left:0}
  .hbar{grid-template-columns:118px 1fr 70px;gap:8px}
  .share{min-width:520px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:110px 1fr}
  input[type=search]{min-width:0;flex:1 1 100%}
  .filters select{flex:1 1 45%}
  .top h1{font-size:18px}
  .gal{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brandmark"><div class="sq">E</div><div><b>Competitor Watch</b><span>Prepared for Enamor</span></div></div>
  <h4>Views</h4>
  <button class="nav on" data-v="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Overview</button>
  <button class="nav" data-v="report"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Strategy report</button>
  <button class="nav" data-v="library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Asset library<span class="n" id="n_assets"></span></button>
  <button class="nav" data-v="creators"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.5-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 4.9"/></svg>Creators<span class="n" id="n_creators"></span></button>
  <div id="brandnav"></div>
  <h4>About the data</h4>
  <p class="note" style="margin:0 8px">Instagram: one year of creator posts per brand. Meta: ads live on the day we pulled them. Counts of posts and ads only; nobody's spend is public.</p>
</aside>
<div class="scrim" id="sidescrim"></div>

<div class="main">
  <div class="top"><div class="in">
    <button class="btn burger" id="burger" aria-label="Menu">☰</button>
    <div><div class="crumb" id="crumb">Overview</div><h1 id="title">How rivals use creators</h1></div>
    <div class="right">
      <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Nov 2025 – Nov 2026</span>
      <button class="btn" id="csv">Download CSV</button>
    </div>
  </div></div>
  <div class="page" id="page"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>

<script>
const ICON={
 ig:'<svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="#fff" stroke="#D6336C" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#D6336C" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.3" fill="#D6336C"/></svg>',
 meta:'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#fff"/><path d="M3.8 15.4c0-4 2-7.4 4.4-7.4 2.6 0 4.2 4.6 6 7 1.2 1.6 2.2 2 3 2 1.4 0 2.8-1.4 2.8-3.8 0-3-1.6-5.7-3.8-5.7-2.3 0-4 3.4-5.3 5.4-1.6 2.6-2.7 4-4.1 4-1.8 0-3-.6-3-1.5z" fill="none" stroke="#1971C2" stroke-width="1.9"/></svg>',
 play:'<svg class="play" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="rgba(255,255,255,.92)"/><path d="M20 15l14 9-14 9z" fill="#15161c"/></svg>'};
let D,ITEMS=[],VIEW='overview',BRAND=null,shown=48;const HOME='Enamor';const RIV=()=>D.brands.filter(b=>b.brand!==HOME);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null||n===''||Number.isNaN(n)?'–':typeof n!=='number'?n:n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e4?Math.round(n/1e3)+'K':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':(Math.round(n*100)/100).toLocaleString();
const num=v=>typeof v==='number'?v:parseFloat(String(v??'').replace(/[%,]/g,''));
const B=b=>D.brands.find(x=>x.brand===b);
const logo=(b,s)=>`<img class="logo ${s||''}" src="media/logos/${B(b).handle}.jpg" alt="">`;
const bname=(b,s)=>`<span class="bn">${logo(b,s)}<span>${esc(b)}${b===HOME?' <em style="font-style:normal;color:var(--accent);font-weight:600">(you)</em>':''}</span></span>`;
const shade=p=>{const t=Math.max(0,Math.min(1,p/60)),m=(a,b)=>Math.round(a+(b-a)*t);return `rgb(${m(255,232)},${m(241,89)},${m(234,12)})`};
const cell=(p,attrs,label)=>`<div class="c" style="background:${p?shade(p):'#f2f3f6'};color:${p>35?'#fff':'#15161c'}" ${attrs}>${label??(p||'')}</div>`;

fetch('data.json').then(r=>r.json()).then(d=>{D=d;boot()});
fetch('campaigns.json').then(r=>r.json()).then(c=>{window.CP=c}).catch(()=>{});

function boot(){
  D.brands.forEach(b=>{b.ig_posts=num(b.sheet['IG collab posts'])||b.ig_posts;b.ig_creators=num(b.sheet['IG collab creators'])||b.ig_creators});  // sheet numbers win
  ITEMS=[...D.posts.map(p=>({...p,src:'ig',kind:p.video||p.format==='Reel'?'Video':'Image',when:p.date,who:p.creator})),

let F={};
function library(f){
  T('Asset library','Every creator post and live ad');
  F={...f}; shown=48;
  const opts=`<option value="">All brands</option>`+D.brands.map(b=>`<option>${esc(b.brand)}</option>`).join('');
  $('#page').innerHTML=`<div class="card"><div class="filters">
     <select id="f_brand">${opts}</select>
     <select id="f_src"><option value="">Instagram + Meta</option><option value="ig">Instagram creator posts</option><option value="ad">All Meta ads</option><option value="cad">Meta creator ads</option></select>
     <select id="f_kind"><option value="">Videos + images</option><option value="Video">Videos</option><option value="Image">Images</option></select>
     <select id="f_theme"></select>
     <select id="f_sort"><option value="date">Newest first</option><option value="views">Most views</option><option value="days">Longest running</option></select>
     <input type="search" id="f_q" placeholder="Search creator, words, product">
     <button class="linkbtn" id="f_clear">Clear</button><span class="count" id="f_count"></span></div>
     <div id="f_chip" class="note" style="margin:-8px 0 14px"></div>
     <div class="gal" id="gal"></div><button class="btn more" id="more">Show more</button></div>`;
  $('#f_brand').value=F.brand||'';$('#f_src').value=F.src||'';$('#f_kind').value=F.kind||'';$('#f_sort').value=F.sort||'date';$('#f_q').value=F.q||'';
  const sync=()=>{F.brand=$('#f_brand').value;F.src=$('#f_src').value;F.kind=$('#f_kind').value;F.sort=$('#f_sort').value;F.q=$('#f_q').value;F.theme=$('#f_theme').value;shown=48;gal()};
  ['f_brand','f_src','f_kind','f_sort','f_theme'].forEach(i=>$('#'+i).onchange=sync); $('#f_q').oninput=sync;
  $('#f_clear').onclick=()=>{F={};library({})};
  $('#more').onclick=()=>{shown+=48;gal()};
  gal();
}
function filtered(){
  const q=(F.q||'').toLowerCase();
  const r=ITEMS.filter(x=>(!F.brand||x.brand===F.brand)&&(!F.src||(F.src==='cad'?x.src==='ad'&&x.partner:x.src===F.src))&&(!F.kind||x.kind===F.kind)
    &&(!F.month||(x.date||'').startsWith(F.month))&&(F.lo==null||(x.followers>=F.lo&&x.followers<F.hi))
    &&(!F.theme||(x.tags.themes||[]).includes(F.theme))&&(!F.tag||[].concat(x.tags[F.tag[0]]||[]).includes(F.tag[1]))&&(!F.who||(x.who||'').toLowerCase()===F.who)
    &&(!q||[x.who,x.caption,x.body,x.transcript,x.title,x.tags.product,x.tags.hook_line].join(' ').toLowerCase().includes(q)));
  const by=F.sort==='views'?(a,b)=>(b.views||0)-(a.views||0):F.sort==='days'?(a,b)=>(b.days||0)-(a.days||0):(a,b)=>(b.when||'').localeCompare(a.when||'');
  return r.sort((a,b)=>(a.poster?0:1)-(b.poster?0:1)||by(a,b));
}
function tile(x){
  const m=x.poster?`<img loading="lazy" src="media/${x.poster}" alt="">${x.video?ICON.play:''}`:`<div class="none">${x.media==='not live'?'This ad has stopped running. Open it in the Ad Library.':x.media==='pending'?'Downloading…':'No preview saved'}</div>`;
  const line=x.src==='ig'?(x.tags.hook_line||x.caption):(x.tags.hook_line||x.body||x.title);
  const nums=x.src==='ig'?`<span><b>${fmt(x.views)}</b> views</span><span><b>${fmt(x.followers)}</b> followers</span>`:`<span><b>${x.days??'–'}</b> ${x.days===1?'day':'days'} live</span><span>since ${new Date(x.started).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>`;
  return `<div class="tile"><div class="thumb">${m}<span class="kind">${x.src==='ig'?esc(x.format||x.kind):x.partner?'Creator ad':'Brand ad'}</span>${(x.src==='ig'?ICON.ig:ICON.meta).replace('<svg','<svg class="src"')}</div>
   <div class="info">${bname(x.brand,'s').replace('font-weight:600','')}<div class="who who-cell" style="gap:7px">${x.avatar?`<img class="av s" loading="lazy" src="media/${x.avatar}">`:''}<span style="overflow:hidden;text-overflow:ellipsis">${x.src==='ig'?'@':''}${esc(x.who)}</span></div><div class="line">${esc(line)}</div>${(x.tags.themes||[]).length?`<div class="themes">${esc(x.tags.themes.join(' · '))}</div>`:''}<div class="nums">${nums}</div></div></div>`;
}
function bindTiles(el,r){document.querySelectorAll(el+' .tile').forEach((t,i)=>t.onclick=()=>open(r[i]))}
function themeOpts(){  // theme list with counts under the other filters
  const keep=F.theme; F.theme=''; const base=filtered(); F.theme=keep;
  const c={}; base.forEach(x=>(x.tags.themes||[]).forEach(t=>c[t]=(c[t]||0)+1));
  $('#f_theme').innerHTML=`<option value="">All themes</option>`+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<option value="${esc(t)}">${esc(t)} (${n})</option>`).join('');
  $('#f_theme').value=keep||'';
}
function gal(){
  themeOpts();
  const r=filtered();
  $('#f_count').textContent=`${r.length.toLocaleString()} ${r.length===1?'asset':'assets'}`;
  const extra=[F.month&&`posted in ${new Date(F.month+'-15').toLocaleString('en',{month:'long',year:'numeric'})}`,F.lo!=null&&`creators with ${fmt(F.lo)}–${F.hi>1e12?'more':fmt(F.hi)} followers`,F.tag&&`tagged "${F.tag[1]}"`,F.who&&`by @${F.who}`].filter(Boolean);
  $('#f_chip').innerHTML=extra.length?`Showing ${esc(extra.join(', '))} · <button class="linkbtn" id="f_x">show all</button>`:'';
  if(extra.length)$('#f_x').onclick=()=>{delete F.month;delete F.lo;delete F.hi;delete F.tag;delete F.who;gal()};
  $('#gal').innerHTML=r.slice(0,shown).map(tile).join('')||'<div class="note">Nothing matches these filters.</div>';
  $('#more').hidden=r.length<=shown; bindTiles('#gal',r.slice(0,shown));
}
function open(x){
  if(!x)return;
  const media=x.video?`<video src="media/${x.video}" poster="${x.poster?'media/'+x.poster:''}" controls autoplay playsinline></video>`:x.poster?`<img class="big" src="media/${x.poster}">`:'';
  const t=x.tags||{},row=(k,v)=>v&&v.length!==0?`<dt>${k}</dt><dd>${esc(Array.isArray(v)?v.join(', '):v)}</dd>`:'';
  const stats=x.src==='ig'?[['Views',fmt(x.views)],['Likes',fmt(x.likes)],['Comments',fmt(x.comments)],['Followers',fmt(x.followers)]]:[['Days live',x.days??'–'],['Versions',x.versions||1],['Format',x.kind],['Since',x.started]];
  $('#panel').innerHTML=`<button class="x" onclick="closeP()">×</button>${bname(x.brand)}
   <div class="who-cell" style="margin-top:14px">${x.avatar?`<img class="av" style="width:44px;height:44px" src="media/${x.avatar}">`:''}<h3 style="font-size:20px">${x.src==='ig'?'@'+esc(x.who):esc(x.who)}</h3></div>
   <div class="note" style="margin-top:2px">${x.src==='ig'?`${esc(x.type)} · ${esc(x.format)} · ${x.date}`:`Meta ${x.partner?'creator ad':'brand ad'} · shown on ${esc(x.platforms||'Meta')}`}</div>
   ${media}<div class="stats">${stats.map(s=>`<div><small>${s[0]}</small><b>${esc(s[1])}</b></div>`).join('')}</div>
   <dl class="kv">${row('Themes',t.themes)+row('Format',t.format)+row('How it opens',t.hooks)+row('Opening line',t.hook_line)+row('Product',t.product)+row('Problem it solves',t.pain_points)+row('Promise',t.benefits)+row('Offer',t.offer)+row('Language',t.register)+row('Creator type',t.persona)+row('In one line',t.summary)+(x.src==='ad'?row('Button',x.cta)+row('Lands on',x.link):'')}</dl>
   ${x.src==='ad'&&window.CP&&CP.ads[x.id]?(c=>`<h4>Likely campaign setup <span class="note" style="font-weight:400">(inferred · ${esc(c.confidence)})</span></h4><dl class="kv"><dt>Objective</dt><dd>${esc(c.objective)}</dd><dt>Funnel stage</dt><dd>${esc(c.stage)}</dd><dt>Placements</dt><dd>${esc(c.placement)}</dd><dt>Geography</dt><dd>${esc(c.geo)}</dd>${c.utm?`<dt>Brand's own tag</dt><dd>${esc(c.utm)}</dd>`:''}</dl><ul class="rul" style="font-size:13px">${c.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`)(CP.ads[x.id]):''}
   ${x.transcript?`<h4>What's said (English)</h4><div class="tx">${esc(x.transcript)}</div>`:''}
   ${(x.caption||x.body)?`<h4>${x.src==='ig'?'Caption':'Ad text'}</h4><div class="tx">${esc(x.caption||x.body)}</div>`:''}
   <p style="margin-top:16px"><a href="${esc(x.src==='ig'?x.link:x.url)}" target="_blank" rel="noopener">${x.src==='ig'?'Open on Instagram':'Open in the Meta Ad Library'} →</a></p>`;
  $('#panel').classList.add('open');$('#scrim').classList.add('open');
}
function closeP(){$('#panel').classList.remove('open');$('#scrim').classList.remove('open');const v=$('#panel video');if(v)v.pause()}
window.closeP=closeP;

/* ================= CREATORS ================= */
function creators(f){
  T('Creators','Who each brand works with');
  $('#page').innerHTML=`<div class="card"><div class="filters"><select id="c_brand"><option value="">All brands</option>${D.brands.map(b=>`<option>${esc(b.brand)}</option>`).join('')}</select>
    <select id="c_sort"><option value="posts">Most posts with the brand</option><option value="followers">Most followers</option><option value="views">Most typical views</option></select>
    <input type="search" id="c_q" placeholder="Search creator"><span class="count" id="c_count"></span></div><div class="scroll"><table class="tbl" id="ct"></table></div></div>`;
  $('#c_brand').value=(f&&f.brand)||'';
  const draw=()=>{const b=$('#c_brand').value,q=$('#c_q').value.toLowerCase(),so=$('#c_sort').value;
    const r=D.creators.filter(c=>(!b||c.brand===b)&&(!q||((c.handle||'')+' '+(c.name||'')).toLowerCase().includes(q)))
      .sort(so==='posts'?(x,y)=>(y.posts+y.ads)-(x.posts+x.ads)||(y.followers||0)-(x.followers||0):(x,y)=>(y[so]||0)-(x[so]||0));
    $('#c_count').textContent=`${r.length.toLocaleString()} creators`;
    $('#ct').innerHTML='<tr><th class="l stick">Creator</th><th class="l">Brand</th><th>Instagram posts</th><th>Paid label</th><th>Meta ads</th><th>Followers</th><th>Typical views</th><th>Engagement</th><th class="l">First post</th></tr>'+
     r.slice(0,500).map(c=>`<tr class="row-hover"><td class="l stick"><div class="who-cell">${c.avatar?`<img class="av" loading="lazy" src="media/${c.avatar}">`:`<span class="av"></span>`}<div>${c.handle?`<a href="https://www.instagram.com/${esc(c.handle)}/" target="_blank" rel="noopener"><b>@${esc(c.handle)}</b></a>`:`<b>${esc(c.name)}</b>`}${c.name&&c.handle?`<div class="note" style="margin:0">${esc(c.name)}</div>`:''}</div></div></td>
      <td class="l">${bname(c.brand,'s')}</td><td class="ev" data-w="${esc((c.handle||c.name||'').toLowerCase())}" data-b="${esc(c.brand)}">${c.posts||'–'}</td><td>${c.paid||'–'}</td>
      <td class="ev" data-w="${esc((c.handle||c.name||'').toLowerCase())}" data-b="${esc(c.brand)}" data-a="1">${c.ads||'–'}</td><td>${fmt(c.followers)}</td><td>${fmt(c.views)}</td>
      <td>${c.er!=null&&c.er<=100?c.er.toFixed(2)+'%':'–'}</td><td class="l">${c.first||'–'}</td></tr>`).join('');
    $('#ct').querySelectorAll('td.ev').forEach(td=>td.onclick=()=>go('library',null,{brand:td.dataset.b,src:td.dataset.a?'cad':'ig',who:td.dataset.w}));};
  ['c_brand','c_sort'].forEach(i=>$('#'+i).onchange=draw); $('#c_q').oninput=draw; draw();
}

/* ================= CSV ================= */
function csv(){
  const cols=VIEW==='creators'?['brand','handle','name','posts','paid','ads','followers','views','er','first']:['brand','src','who','kind','date','started','days','views','likes','followers','format','link','url'];
  const rows=VIEW==='creators'?D.creators:(VIEW==='library'?filtered():ITEMS);
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const blob=new Blob([[cols.join(','),...rows.map(r=>cols.map(c=>q(r[c]??(c==='format'?r.tags?.format:''))).join(','))].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`enamor-competitors-${VIEW}.csv`;a.click();
}
</script>
